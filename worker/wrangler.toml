name = "soothia-proxy"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

# api.soothia.fun is the public API address; the workers.dev URL keeps serving.
routes = [
  { pattern = "api.soothia.fun", custom_domain = true },
]
# The Sui and Walrus Memory SDKs expect some Node built-ins.
compatibility_flags = ["nodejs_compat"]

# Secrets (never put values here):
#   ANTHROPIC_API_KEY: local in .dev.vars, deployed via `npx wrangler secret put ANTHROPIC_API_KEY`
#   ADMIN_TOKEN: gates GET /debug/* (header X-Soothia-Admin); `openssl rand -hex 32 | npx wrangler secret put ADMIN_TOKEN`
#   MEMWAL_ACCOUNT_ID: Walrus Memory account object id on Sui
#   MEMWAL_KEY: Walrus Memory delegate private key; pays for Sui commits unless SUI_COMMIT_KEY is set
#   MEMWAL_SERVER_URL: optional, overrides the mainnet relayer
#   TATUM_API_KEY: Sui mainnet reads and commits through Tatum
#   SUI_COMMIT_KEY: optional, a separate private key that pays for Sui commits
#   SOOTHIA_RECALL_PACKAGE: published soothia_recall package id (not secret)
#   RESOLVER_KEY: private key holding the staking ResolverCap; `npx wrangler secret put RESOLVER_KEY`

# Open picks for the sweep, spending caps and public stats.
[[kv_namespaces]]
binding = "SOOTHIA_CACHE"
id = "603952ecd4ea42f3b372051b7fe789ff"

# Not secret. RECALL_OWNER_KEYS: comma-separated Total Recall user keys with the higher daily commit cap.
[vars]
RECALL_OWNER_KEYS = "ffe06f0d02e4440a"
# The soothia_stake package, its shared Config and the ResolverCap. Not secret.
STAKE_PACKAGE = "0xf9507a1cb35b01c191614a67bf5ca3f22c7c3a7745fdc7ddea67369686a6720f"
STAKE_CONFIG = "0x7ba41f413b54f1f04b592694ad3304caa87df7cf9f1afda98b42c45362d2b3be"
STAKE_RESOLVER_CAP = "0x8a8bc9de0047bd4d99fabb7e5c655c3f1d407c743ad1711f2a638861b81bae4e"

# Two sweeps share this schedule: open picks at :00, :15, :30, :45, and staking pools five minutes later.
[triggers]
crons = ["*/5 * * * *"]
